<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core Shield — Server Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #06080c;
            color: #cbd5e1;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Top Navigation Bar -->
    <header class="border-b border-slate-800/60 bg-[#0b0f17]/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            
            <!-- Brand Logo -->
            <a href="https://core-bot.pages.dev" class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400">
                    <i class="fa-solid fa-lock text-sm"></i>
                </div>
                <span class="font-bold text-white text-lg tracking-wide">Core <span class="text-emerald-400">Dashboard</span></span>
            </a>

            <!-- Right Profile Header -->
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-3 px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-800">
                    <div class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div>
                    <span class="text-xs font-semibold text-slate-300">Active Guild Selected</span>
                </div>
                <a href="https://core-bot.pages.dev" class="text-xs font-semibold text-slate-400 hover:text-white transition-colors flex items-center gap-2">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i> Exit
                </a>
            </div>
        </div>
    </header>

    <!-- Main Dashboard Body -->
    <div class="max-w-7xl mx-auto px-6 py-8 w-full flex-grow grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Sidebar Navigation -->
        <aside class="lg:col-span-3 space-y-6">
            
            <!-- Server Card Selector -->
            <div class="bg-[#0b0f17] border border-slate-800/60 rounded-2xl p-4 flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-slate-800 border border-slate-700/50 flex items-center justify-center text-slate-300 font-bold text-sm">
                    <i class="fa-solid fa-server text-emerald-400"></i>
                </div>
                <div class="overflow-hidden">
                    <p class="text-xs text-slate-500 font-mono">MANAGED SERVER</p>
                    <p class="text-sm font-bold text-white truncate">Target Guild</p>
                </div>
            </div>

            <!-- Command Modules Navigation List -->
            <nav class="space-y-1">
                <p class="px-3 text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2">Available Modules</p>
                
                <!-- Command: /sentry (Active) -->
                <a href="#sentry" class="flex items-center justify-between px-4 py-3 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 font-semibold text-sm transition-all">
                    <div class="flex items-center gap-3">
                        <i class="fa-solid fa-shield-halved text-base"></i>
                        <span>/sentry</span>
                    </div>
                    <span class="text-[10px] bg-emerald-500/20 px-2 py-0.5 rounded-full font-mono uppercase text-emerald-300">Configured</span>
                </a>

                <!-- Placeholder Modules -->
                <div class="opacity-40 cursor-not-allowed flex items-center justify-between px-4 py-3 text-slate-400 font-medium text-sm">
                    <div class="flex items-center gap-3">
                        <i class="fa-solid fa-user-shield text-base"></i>
                        <span>/moderate</span>
                    </div>
                    <span class="text-[10px] bg-slate-800 px-2 py-0.5 rounded-full font-mono uppercase text-slate-400">Soon</span>  
                </div>

            </nav>
        </aside>

        <!-- Main Workspace Area -->
        <main class="lg:col-span-9">
            
            <!-- /sentry Command Configuration Panel -->
            <div id="sentry" class="space-y-6">
                





                <!-- Pure HTML Form Posting Straight to FastAPI -->
                <form action="/api/guild/honeypot/update" method="POST" class="space-y-6">
                    <input type="hidden" name="guild_id" value="{{ guild_id }}">
                    <input type="checkbox" name="sentry_enabled" class="sr-only peer" {% if sentry_enabled %}checked{% endif %}>
                    <select name="enforcement_action">
                        <option value="ban" {% if enforcement_action == 'ban' %}selected{% endif %}>Instant Server Ban</option>
                        <option value="kick" {% if enforcement_action == 'kick' %}selected{% endif %}>Kick Member</option>
                        <option value="quarantine" {% if enforcement_action == 'quarantine' %}selected{% endif %}>Assign Quarantine / Mute Role</option>
                        <option value="log" {% if enforcement_action == 'log' %}selected{% endif %}>Silent Log (Monitor Only)</option>
                    </select>
                    <input type="text" name="log_channel_id" value="{{ log_channel_id }}" placeholder="e.g. 123456789012345678">
                    <button type="submit">Save /sentry Settings</button>
                </form>





            </div>
        </main>
    </div>

    <!-- Page Footer -->
    <footer class="border-t border-slate-800/60 py-6 text-center text-slate-500 text-xs">
        <p>&copy; Core Bot Infrastructure. Hosted on Cloudflare Pages.</p>
    </footer>

</body>
</html>
